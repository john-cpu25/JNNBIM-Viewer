# Builds apps/Jnn.Web and publishes it to GitHub Pages.
# Repo setting required once: Settings → Pages → Source = "GitHub Actions".
name: Deploy web viewer to GitHub Pages

# Runs on every push to main (a path filter skipped the first force-push
# deploy), and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/Jnn.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/Jnn.Web/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build (type-check + Vite)
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/Jnn.Web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
