name: CI Quality & E2E Tests

on:
  push:
    branches: [main, 'gemini/**']
    paths:
      - 'apps/Jnn.Web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/Jnn.Web/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & E2E Tests (IFC + Sample)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/Jnn.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/Jnn.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit & Component tests (Vitest)
        run: npm test

      - name: Build web bundle (TypeScript + Vite)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Playwright with SwiftShader)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/Jnn.Web/test-results/
          retention-days: 7
