<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JNN Spike — That Open IFC Loader</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #111418;
        color: #e5e7eb;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        background: #1b1f24;
        border-bottom: 1px solid #2d333b;
        padding: 10px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      header h1 {
        font-size: 16px;
        font-weight: 600;
        color: #f97316;
        margin-right: 8px;
      }
      .btn {
        background: #232830;
        color: #f3f4f6;
        border: 1px solid #374151;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn:hover {
        background: #374151;
        border-color: #f97316;
      }
      .btn-primary {
        background: #f97316;
        color: #fff;
        border-color: #ea580c;
      }
      .btn-primary:hover {
        background: #ea580c;
      }
      input[type="file"] {
        display: none;
      }
      #container {
        flex: 1;
        position: relative;
        width: 100%;
        height: 100%;
        background: #181c20;
      }
      #viewport {
        width: 100%;
        height: 100%;
        display: block;
      }
      #stats-panel {
        position: absolute;
        top: 12px;
        right: 12px;
        background: rgba(20, 24, 30, 0.92);
        border: 1px solid #374151;
        border-radius: 8px;
        padding: 12px 16px;
        font-family: monospace;
        font-size: 12px;
        line-height: 1.6;
        max-width: 360px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        pointer-events: auto;
      }
      #stats-panel h3 {
        color: #f97316;
        font-size: 13px;
        margin-bottom: 6px;
        border-bottom: 1px solid #374151;
        padding-bottom: 4px;
      }
      .badge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 4px;
        background: #2d333b;
        color: #60a5fa;
        font-size: 11px;
      }
      #log-output {
        position: absolute;
        bottom: 12px;
        left: 12px;
        max-width: 500px;
        max-height: 160px;
        overflow-y: auto;
        background: rgba(15, 18, 22, 0.9);
        border: 1px solid #2d333b;
        border-radius: 6px;
        padding: 8px 12px;
        font-family: monospace;
        font-size: 11px;
        color: #9ca3af;
      }
      .status-ok { color: #34d399; }
      .status-err { color: #f87171; }
      .status-info { color: #60a5fa; }
    </style>
  </head>
  <body>
    <header>
      <h1>JNN IFC Spike</h1>
      <label class="btn btn-primary">
        Chọn file IFC từ máy
        <input type="file" id="ifc-file-input" accept=".ifc" />
      </label>
      <button class="btn" id="load-sample-arch">Mẫu nhỏ: Arch (~90 KB)</button>
      <button class="btn" id="load-sample-struct">Mẫu nhỏ: Struct (~106 KB)</button>
      <button class="btn" id="export-frag-btn" disabled>Xuất .frag</button>
      <label class="btn" id="load-frag-label">
        Nạp file .frag
        <input type="file" id="frag-file-input" accept=".frag" />
      </label>
    </header>

    <div id="container">
      <div id="viewport"></div>
      <div id="stats-panel">
        <h3>THỐNG KÊ HIỆU NĂNG</h3>
        <div id="stats-content">Chưa nạp mô hình. Chọn file IFC hoặc bấm nút mẫu ở trên.</div>
      </div>
      <div id="log-output"></div>
    </div>

    <script type="module" src="../src/spike/ifcSpike.ts"></script>
  </body>
</html>
